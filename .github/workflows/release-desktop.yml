# Noska Desktop — cross-platform release builds.
#
# Triggered by pushing a tag like `desktop-v1.0.0` or manually. Each native
# runner produces its own signed artifacts and uploads them to a DRAFT GitHub
# release. Publishing is manual on purpose: a failed platform job leaves the
# draft incomplete instead of shipping partial releases.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           updater private key (.tauri/noska.key content)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater key password
# Optional (macOS signing/notarization):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # builds Universal (Apple Silicon + Intel)
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable (+ universal target on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies (WebKitGTK and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Noska desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          # Frontend env baked into the bundle at build time (public-by-design
          # values only — see .env.example). Without these the app cannot boot.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # macOS signing/notarization env (APPLE_CERTIFICATE, APPLE_ID, …)
          # is intentionally NOT referenced here yet: empty-string env vars
          # make tauri attempt keychain signing and fail the build. Add the
          # lines when the secrets exist — docs/desktop/SIGNING-NOTARIZATION.md.
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: "Noska Desktop v__VERSION__"
          releaseBody: "Installers for Windows (.exe/.msi), macOS (.dmg) and Linux (.AppImage/.deb/.rpm). Auto-update manifest: latest.json"
          releaseDraft: true
          prerelease: false

      - name: Upload standalone artifacts (kept even without a release)
        uses: actions/upload-artifact@v4
        with:
          name: noska-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/rpm/*
          if-no-files-found: warn

  # Mirrors the signed artifacts + latest.json from the private staging
  # release to the PUBLIC distribution repo (shrikrishna-lab/noska-desktop-releases).
  # Only release artifacts move — never source, secrets, or private config.
  publish-public:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-desktop.result == 'success' }}
    permissions:
      contents: write # drafts are only visible to tokens with write access
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + tag
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download staged artifacts from the private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.ver.outputs.tag }}" \
            --repo shrikrishna-lab/noska \
            --dir dist --clobber --pattern "*"

      - name: Publish to the public release repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo shrikrishna-lab/noska-desktop-releases > /dev/null 2>&1; then
            gh release upload "$TAG" --repo shrikrishna-lab/noska-desktop-releases --clobber dist/*
          else
            gh release create "$TAG" dist/* \
              --repo shrikrishna-lab/noska-desktop-releases \
              --title "Noska Desktop v${{ steps.ver.outputs.version }}" \
              --notes "Installers for Windows (.exe/.msi), macOS (.dmg, Apple Silicon + Intel) and Linux (.AppImage/.deb/.rpm). Auto-update manifest: latest.json"
          fi
