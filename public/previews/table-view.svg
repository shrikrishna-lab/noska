<svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="120" rx="8" fill="#F7F7F7"/>
  <!-- Header row with a single "Name" column -->
  <rect x="16" y="16" width="168" height="20" rx="4" fill="#E0E0E0"/>
  <rect x="24" y="23" width="34" height="6" rx="3" fill="#AAA"/>
  <!-- Table outline, empty (no rows) -->
  <rect x="16" y="16" width="168" height="66" rx="4" stroke="#CCC" stroke-width="1" fill="none"/>
  <!-- "+ New" row affordance -->
  <line x1="24" y1="52" x2="30" y2="52" stroke="#BBB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="49" x2="27" y2="55" stroke="#BBB" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="36" y="49" width="30" height="6" rx="3" fill="#E5E5E5"/>
  <text x="16" y="110" font-family="system-ui" font-size="10" fill="#999">Empty table — one Name column</text>
</svg>
